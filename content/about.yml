  - ongoing: false
    date: 2023-11-23
    title: 一起去墾丁石牛溪
    body: 心寶19歲生日，我們一起回到心寶小時候和全家人一起去的石牛溪農場！一個很特別的小秘密！就是啊心寶在9歲時有偷偷許願將來要和心愛的人再來一次！這個願望真的實現啦！！！
  - ongoing: false
    body: >
      為了見到理了光頭、宛如可愛奇異果的老蕭，心寶一大早熱血地連轉火車、高鐵與台鐵衝到台中，與隨和又搞笑的老蕭爸媽會合—甚至在入營安檢時發生了莫里斯誤開「引擎蓋」的超無厘頭插曲！雖然化解了原本無敵緊張的心情，也順利相聚，但看到老蕭回家後心情低落又哭哭，依然讓心寶滿滿的心疼與不捨。
    date: 2024-03-02
    title: 參加老蕭的懇請會！
