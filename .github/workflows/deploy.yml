name: Build and deploy site

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # 23:00 UTC = ~07:00 Taiwan time. Without this, the homepage's "回憶"
    # (on-this-day) section only updates when someone edits content — a
    # static build has no other way to know what "today" actually is.
    - cron: "0 23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npx eleventy --pathprefix=/Candice-Chieh/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
